name: CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install lint tools
        run: make -s go-get-tools
      - name: Run Gofmt diff
        run: make -s fmt-diff
      - name: Run Golint
        run: make -s lint
      - name: Run Vet
        run: make -s vet
      - name: GolangCI Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: make -s test
